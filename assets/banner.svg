<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Haroon Hayat, Senior Full Stack and AI Engineer">
  <defs>
    <radialGradient id="g1" cx="85%" cy="20%" r="60%"><stop offset="0" stop-color="#7c5cff" stop-opacity=".55"/><stop offset="1" stop-color="#7c5cff" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="10%" cy="110%" r="55%"><stop offset="0" stop-color="#14d3a8" stop-opacity=".35"/><stop offset="1" stop-color="#14d3a8" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .cursor{animation:blink 1.1s steps(1) infinite}
      .node{animation:pulse 2.4s ease-in-out infinite}
      .n2{animation-delay:.6s}.n3{animation-delay:1.2s}.n4{animation-delay:1.8s}
      .edge{stroke-dasharray:6 8;animation:flow 3s linear infinite}
      @keyframes blink{50%{opacity:0}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
      @keyframes flow{to{stroke-dashoffset:-56}}
      @media (prefers-reduced-motion:reduce){.cursor,.node,.edge{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="20" fill="#0b0f17"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#g1)"/>
  <rect width="1200" height="320" rx="20" fill="url(#g2)"/>

  <text x="64" y="80" class="mono" font-size="18" fill="#14d3a8">~/hayatharoon $ whoami<tspan class="cursor" fill="#e6edf3"> ▍</tspan></text>
  <text x="62" y="168" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="-2">Haroon Hayat</text>
  <text x="64" y="216" font-size="26" fill="#c9d1d9">Senior Full Stack &amp; AI Engineer</text>
  <text x="64" y="262" class="mono" font-size="17" fill="#8b949e">LLM · agentic systems · end-to-end product</text>

  <!-- an agent graph: one planner fanning out to tool agents -->
  <g stroke="#7c5cff" stroke-width="2" fill="none" stroke-opacity=".8">
    <path class="edge" d="M920 160 L1040 90"/><path class="edge" d="M920 160 L1070 170"/><path class="edge" d="M920 160 L1030 245"/><path class="edge" d="M1040 90 L1070 170"/>
  </g>
  <circle cx="920" cy="160" r="22" fill="#7c5cff"/>
  <circle class="node" cx="1040" cy="90" r="12" fill="#14d3a8"/>
  <circle class="node n2" cx="1070" cy="170" r="12" fill="#14d3a8"/>
  <circle class="node n3" cx="1030" cy="245" r="12" fill="#14d3a8"/>
  <circle class="node n4" cx="1125" cy="115" r="6" fill="#e6edf3"/>
</svg>
